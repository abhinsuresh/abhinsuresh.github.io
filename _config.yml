title: "Abhin Suresh"
name: "Abhin Suresh"
description: "Research Software Engineering • Computational Physicst • AI/ML • HPC"
url: "https://abhinsuresh.github.io/profile"   # no trailing slash
baseurl: ""                        # keep empty for user site
repository: "https://github.com/abhinsuresh/profile"

# Minimal Mistakes theme
remote_theme: "mmistakes/minimal-mistakes"

# Look & feel
minimal_mistakes_skin: "mint"      # try: default, air, mint, dark, contrast, sunrise
locale: "en-US"
permalink: /:categories/:title/
paginate: 6
paginate_path: "/blog/page:num/"

# Plugins (all work on GitHub Pages; if any build error, remove it temporarily)
plugins:
  - jekyll-include-cache
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed

# Author profile (shows in sidebar on pages with author_profile: true)
author:
  name: "Abhin Suresh"
  avatar: "/assets/images/avatar.jpg"   # upload later
  bio: "Research Software Engineering • Computational Physicst • AI/ML • HPC"
  location: "Newark, DE"
  links:
    - label: "Twitter"
      icon: "fab fa-fw fa-twitter-square"
      url: "https://x.com/ASuresh1994"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/abhinsuresh"
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/abhinsuresh/"
    - label: "GitLab"
      icon: "fab fa-fw fa-gitlab"
      url: "https://gitlab.com/abhinsuresh"
    - label: "Email"
      icon: "fas fa-fw fa-envelope"
      url: "mailto:"

# Defaults so you don't repeat front matter
defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "single"
      author_profile: true
      toc: true
      toc_sticky: true
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "single"
      author_profile: true
      read_time: true
      share: true

# Footer
footer:
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/abhinsuresh"
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/abhinsuresh/"

# SEO
#logo: "/assets/images/avatar.jpg"
